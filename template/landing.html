<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>micro:bit Workshops</title>
<link rel="icon" type="image/png" href="assets/rcja-logo.png">
<link rel="apple-touch-icon" href="assets/rcja-logo.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--navy:#1b2945;--navy-mid:#263a5e;--green:#3fd37f;--green-dark:#339655;
        --brand-green:#9dbd38;--border:#d0d7e3;--surface:#f4f6fa;--muted:#666;--label:#3a3a3a}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#0a0a0a;
       background:#fff;line-height:1.6}
  /* ── Site header (RoboCup Junior Australia style) ── */
  .site-topbar{background:var(--navy)}
  .topbar-inner{max-width:1160px;margin:0 auto;height:44px;padding:0 24px;
                display:flex;align-items:center;justify-content:flex-end;gap:22px}
  .topbar-links{display:flex;gap:22px}
  .topbar-links a{color:rgba(255,255,255,.82);text-decoration:none;font-size:13px;font-weight:600}
  .topbar-links a:hover{color:#fff}
  .topbar-cta{background:var(--brand-green);color:var(--navy);text-decoration:none;
              font-size:13px;font-weight:700;height:44px;padding:0 22px;margin-right:-24px;
              display:flex;align-items:center}
  .topbar-cta:hover{filter:brightness(1.06)}
  .site-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
  .site-nav-inner{max-width:1160px;margin:0 auto;height:84px;padding:0 24px;
                  display:flex;align-items:center;gap:32px}
  .site-logo{flex-shrink:0;display:flex;align-items:center}
  .site-logo img{height:56px;width:auto;display:block}
  .site-menu{margin-left:auto;display:flex;align-items:center;gap:26px}
  .site-menu a{color:var(--navy);text-decoration:none;font-size:15px;font-weight:600;
               letter-spacing:-0.01em;padding:6px 0;border-bottom:3px solid transparent}
  .site-menu a:hover{color:var(--green-dark)}
  .site-menu a.active{color:var(--green-dark);border-bottom-color:var(--brand-green)}
  @media(max-width:820px){.topbar-links{display:none}.site-menu{display:none}
    .site-nav-inner{height:64px}.site-logo img{height:44px}}
  .lp-hero{background:var(--navy);padding:64px 24px}
  .lp-hero-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:28px}
  .lp-logo{flex-shrink:0}
  .lp-logo img{height:96px;width:auto;display:block}
  .lp-kicker{font-size:11px;font-weight:700;text-transform:uppercase;
             letter-spacing:.1em;color:var(--green);margin-bottom:14px}
  .lp-hero h1{font-size:clamp(30px,5vw,52px);font-weight:700;letter-spacing:-0.035em;
              color:#fff;line-height:1.1}
  .lp-main{max-width:1000px;margin:0 auto;padding:48px 24px}
  .workshop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
                 gap:20px}
  .workshop-card{display:block;border:1.5px solid var(--border);text-decoration:none;
                 color:inherit;background:#fff;transition:border-color .15s,transform .15s}
  .workshop-card:hover{border-color:var(--green);transform:translateY(-2px)}
  .wc-img{height:160px;overflow:hidden;background:var(--surface)}
  .wc-img img{width:100%;height:100%;object-fit:cover;display:block}
  .wc-stripe{height:6px}
  .wc-body{padding:24px}
  .wc-title{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-0.02em}
  .wc-sub{font-size:13px;color:var(--muted);margin:2px 0 12px}
  .wc-blurb{font-size:14px;color:var(--label);line-height:1.6}
  .wc-metas{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .wc-meta{font-size:11px;font-weight:600;background:var(--surface);
           border:1px solid var(--border);color:var(--muted);padding:3px 9px}
  .wc-cta{font-size:12px;font-weight:700;color:var(--green-dark);text-transform:uppercase;
          letter-spacing:.05em}
  .workshop-card--soon{cursor:default}
  .workshop-card--soon:hover{border-color:var(--border);transform:none}
  .workshop-card--soon .wc-title,.workshop-card--soon .wc-blurb{opacity:.6}
  .workshop-card--soon .wc-img img{filter:grayscale(1);opacity:.55}
  .wc-cta--soon{color:var(--muted)}
  .lp-footer{max-width:1000px;margin:0 auto;padding:0 24px 64px;
             font-size:13px;color:var(--muted);display:flex;align-items:center;gap:14px}
  .lp-footer img{height:44px;width:auto;flex-shrink:0}
  @media(max-width:640px){.lp-hero{padding:44px 16px}.lp-main{padding:32px 16px}
    .lp-hero-inner{flex-direction:column;align-items:flex-start;gap:20px}
    .lp-logo img{height:72px}}
</style>
</head>
<body>
  <div class="site-topbar">
    <div class="topbar-inner">
      <nav class="topbar-links">
        <a href="https://www.robocupjunior.org.au/sponsor-us/">Sponsor Us</a>
        <a href="https://www.robocupjunior.org.au/store/">Store</a>
      </nav>
      <a class="topbar-cta" href="https://www.robocupjunior.org.au/event-registration-results/">Event Registration &amp; Results</a>
    </div>
  </div>
  <header class="site-nav">
    <div class="site-nav-inner">
      <a class="site-logo" href="index.html" aria-label="RoboCup Junior Australia — micro:bit workshops">
        <img src="assets/rcja-logo.svg" alt="RoboCup Junior Australia">
      </a>
      <nav class="site-menu">
        <a href="https://www.robocupjunior.org.au/about-us/">About Us</a>
        <a href="https://www.robocupjunior.org.au/challenges/">Challenges</a>
        <a class="active" href="index.html">Workshops</a>
        <a href="https://www.robocupjunior.org.au/event-regions/">Event Regions</a>
        <a href="https://www.robocupjunior.org.au/our-community/">Our Community</a>
        <a href="https://www.robocupjunior.org.au/contact-us/">Contact Us</a>
      </nav>
    </div>
  </header>
  <section class="lp-hero">
    <div class="lp-hero-inner">
      <div>
        <div class="lp-kicker">RoboCup Junior Australia</div>
        <h1>micro:bit Workshops</h1>
      </div>
    </div>
  </section>
  <main class="lp-main">
    <div class="workshop-grid">
      <!-- WORKSHOP_CARDS -->
    </div>
  </main>
  <footer class="lp-footer">
    <img src="assets/rcja-logo.svg" alt="RoboCup Junior Australia">
    <span>RoboCup Junior Australia · built for classroom use</span>
  </footer>
</body>
</html>
